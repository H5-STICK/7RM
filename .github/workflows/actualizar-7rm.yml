
name: Actualizar 7RM

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener token y generar playlist
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin

          pagina = (
              "https://www.la7tv.es/a-la-carta/"
              "7tv-en-directo/20220810150726000939.html"
          )
          origen = (
              "https://rtv-murcia-live.globalmest.com/"
              "principal/smil:principal.smil/playlist.m3u8"
          )

          def descargar(url):
              solicitud = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(
                  solicitud, timeout=30
              ) as respuesta:
                  return respuesta.read().decode("utf-8-sig")

          html = descargar(pagina)

          coincidencia = re.search(
              r'Q3zG7J\.js\?token=([^"&\s<>]+)',
              html
          )
          if not coincidencia:
              raise RuntimeError(
                  "No se encontro el token de GlobalMest"
              )

          token = coincidencia.group(1)
          url_maestra = origen + "?auth_token=" + token
          contenido = descargar(url_maestra)

          if not contenido.startswith("#EXTM3U"):
              raise RuntimeError("Respuesta HLS no valida")

          if "#EXT-X-STREAM-INF" not in contenido:
              raise RuntimeError("No hay variantes HLS")

          lineas = contenido.splitlines()
          resultado = []

          for linea in lineas:
              if linea and not linea.startswith("#"):
                  linea = urljoin(origen, linea)
              resultado.append(linea)

          with open(
              "7RM.m3u8", "w", encoding="utf-8"
          ) as archivo:
              archivo.write("\n".join(resultado) + "\n")

          print("Playlist 7RM generada correctamente")
          print(
              "Calidades:",
              contenido.count("#EXT-X-STREAM-INF")
          )
          PY

      - name: Publicar playlist actualizada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add 7RM.m3u8

          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar playlist 7RM"
            git push
          fi
